plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}


tasks.register('genUUID') {
    def outDir = file("$buildDir/generated/assets/asr-model")
    def outFile = file("$outDir/uuid")
    doLast {
        mkdir outDir
        outFile.text = UUID.randomUUID().toString()
    }
}

preBuild.dependsOn(genUUID)

android {

    namespace 'ir.am3n.persian.asr'
    compileSdk 35

    defaultConfig {
        minSdk 21
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64', 'x86' }
        consumerProguardFiles 'proguard-rules.pro'
    }

    sourceSets {
        main {
            assets.srcDirs += "$buildDir/generated/assets"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

}

dependencies {
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'com.google.code.gson:gson:2.13.1'
}